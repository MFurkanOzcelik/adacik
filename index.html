<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Klon Notch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="shell" class="closed">
    <div id="mini">
      <canvas id="miniArt" width="48" height="48"></canvas>
      <span id="miniText"><span id="miniInner"></span></span>
      <span class="eq"><i></i><i></i><i></i></span>
    </div>
    <div id="info"><span id="infoClock"></span><span id="infoBat"><span class="batt"><i></i><svg class="bolt" viewBox="0 0 10 14" aria-hidden="true"><path d="M6.2 0 .6 7.9h3.6L3.4 14 9.4 5.8H5.6z"/></svg></span><span id="infoPct"></span></span></div>
    <div id="osd"><span id="osdIcon"></span><span id="osdBar"><i></i></span><b id="osdVal"></b></div>
    <div id="notif"><span id="notifIcon"></span><div class="nt"><div class="nh"><span id="notifApp"></span><span class="nnow">şimdi</span></div><b id="notifTitle"></b><span id="notifBody"></span></div></div>
    <div id="tpill"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" class="tpbg"/><circle id="tpRing" cx="9" cy="9" r="7" stroke-dasharray="44"/></svg><b id="tpTime"></b><span id="tpLabel"></span></div>
    <button id="pinBtn" title="Pin open (Ctrl+Alt+N)" aria-pressed="false"></button>
    <div id="glow"></div>
    <div id="content">
      <div id="bar"><button id="back" class="icon"></button><h2 id="title"></h2><div id="barActions"></div></div>
      <div id="view"></div>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script src="vendor/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
